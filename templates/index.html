
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe AI Game</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <main class="game-container">

        <header class="game-header">
            <h1>Tic Tac Toe</h1>
            <p>Challenge your mind. Play against AI!</p>
        </header>

        <section class="game-settings">
            <label for="game-mode">Game Mode:</label>
            <select id="game-mode">
                <option value="ai">Human vs AI</option>
                <option value="human">Human vs Human</option>
            </select>

            <label for="algorithm">AI Algorithm:</label>
            <select id="algorithm">
                <option value="alpha_beta">Alpha-Beta Pruning</option>
                <option value="minimax">Minimax</option>
            </select>
        </section>

        <section class="game-info">
            <h2 id="status">Player X's Turn</h2>
            <p id="message">Choose an empty cell to make your move.</p>
        </section>

        <section class="board" id="game-board" aria-label="Tic Tac Toe board">
            <button class="cell" data-position="0" aria-label="Cell 1"></button>
            <button class="cell" data-position="1" aria-label="Cell 2"></button>
            <button class="cell" data-position="2" aria-label="Cell 3"></button>
            <button class="cell" data-position="3" aria-label="Cell 4"></button>
            <button class="cell" data-position="4" aria-label="Cell 5"></button>
            <button class="cell" data-position="5" aria-label="Cell 6"></button>
            <button class="cell" data-position="6" aria-label="Cell 7"></button>
            <button class="cell" data-position="7" aria-label="Cell 8"></button>
            <button class="cell" data-position="8" aria-label="Cell 9"></button>
        </section>

        <section class="game-controls">
            <button id="new-game-btn">New Game</button>
        </section>

        <footer class="game-footer">
            <p>CSE440 Artificial Intelligence Project</p>
        </footer>

    </main>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>

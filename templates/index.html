
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Human vs Robot | Tic Tac Toe</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <main class="game-container">

        <header class="header">
            <div class="small-title">A LITTLE GAME OF STRATEGY</div>
            <h1>Tic Tac Toe <span>♡</span></h1>
            <p>Can you beat the robot?</p>
        </header>

        <section class="characters">

            <div class="character human">
                <div class="character-picture">👦🏻</div>
                <h3>Human</h3>
                <p>Player X</p>
            </div>

            <div class="versus">VS</div>

            <div class="character robot">
                <div class="character-picture">🤖</div>
                <h3>Robot</h3>
                <p>Player O</p>
            </div>

        </section>

        <section class="game-info">
            <h2 id="status">Player X's Turn</h2>
            <p id="message">Choose a box to make your move!</p>
        </section>

        <section class="board" id="game-board"
                 aria-label="Tic Tac Toe board">

            <button class="cell" data-position="0" aria-label="Cell 1"></button>
            <button class="cell" data-position="1" aria-label="Cell 2"></button>
            <button class="cell" data-position="2" aria-label="Cell 3"></button>

            <button class="cell" data-position="3" aria-label="Cell 4"></button>
            <button class="cell" data-position="4" aria-label="Cell 5"></button>
            <button class="cell" data-position="5" aria-label="Cell 6"></button>

            <button class="cell" data-position="6" aria-label="Cell 7"></button>
            <button class="cell" data-position="7" aria-label="Cell 8"></button>
            <button class="cell" data-position="8" aria-label="Cell 9"></button>

        </section>

        <section class="settings">
            <label for="game-mode">Choose Game Mode</label>
            <select id="game-mode">
                <option value="ai">Human vs Robot</option>
                <option value="human">Human vs Human</option>
            </select>

            <label for="algorithm">Robot Intelligence</label>
            <select id="algorithm">
                <option value="alpha_beta">Smart Robot (Alpha-Beta)</option>
                <option value="minimax">Robot (Minimax)</option>
            </select>
        </section>

        <button id="new-game-btn" class="new-game-btn">
            ↻ New Game
        </button>

        <footer>
            Made with ♡ | CSE440 AI Project
        </footer>

    </main>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
